version: 2
updates:
  # Every action in our workflows is pinned by commit SHA with a version
  # comment; Dependabot moves the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # CI tools (go-mod-outdated), pinned in tools/go.mod. The root module is left
  # out on purpose: ecosystem dependencies move only to released versions, in
  # the order the cascade tiers set, and the deps job already reports
  # what is behind.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    groups:
      tools:
        patterns: ["*"]
