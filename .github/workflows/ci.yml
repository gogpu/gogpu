name: CI

# CI Strategy:
# - Tests run on Linux, macOS, and Windows (cross-platform GPU library)
# - Go 1.25+ required (matches go.mod requirement)
# - CGO_ENABLED=0: Pure Go library, no C compiler required
#
# Branch Strategy (GitHub Flow):
# - main branch: Production-ready code
# - Feature branches: Tested via pull_request trigger
# - Pull requests: Must pass all checks before merge

env:
  CGO_ENABLED: "0"
  # Never download a newer Go behind our back: each job must run the Go it asked
  # for, or the minimum and oldstable legs prove nothing.
  GOTOOLCHAIN: local

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write  # Required for Codecov OIDC token

jobs:
  # Build verification - Cross-platform
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build all packages
      run: go build ./...

    - name: Build examples
      run: go build ./examples/...

    # The browser platform (js && wasm files) is compiled nowhere else in CI.
    - name: Build for the browser (js/wasm)
      if: matrix.os == 'ubuntu-latest'
      env:
        GOOS: js
        GOARCH: wasm
      run: go build ./...

  # No 386 leg, decided by measurement (2026-11-08, main 57a36d0):
  #   GOARCH=386 go build ./... fails with
  #   - internal/platform/platform_windows.go:213: constant 18446744073709551614 overflows uintptr
  #     (fixed in the same PR as this comment: the literal became ^uintptr(1));
  #   - github.com/gogpu/wgpu/core/track: buffer.go:179, encoder_tracker.go:268, texture.go:250:
  #     constant 4294967294 overflows int;
  #   - github.com/gogpu/wgpu/internal/raytracing: build.go:198: math.MaxUint32 (4294967295)
  #     overflows int.
  # wgpu screens those in v0.34.11 (fix/goarch-386, 1183df5, comparisons moved to uint64).
  # Add the leg — GOARCH=386 go build ./... and go test ./..., as the standard has it —
  # once gogpu depends on wgpu >= v0.34.11 and that build passes.

  # Unit tests - Cross-platform
  test:
    name: Test - ${{ matrix.os }} - Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Each OS and Go version is separate evidence: with the default, one
      # failure cancels the other legs and their results never show
      # (gogpu/ui#247, run 42469289570, 2026-11-08).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The two supported releases. The go.mod minimum is the test-minimum
        # job below, which tests exactly the `go` line we promise importers.
        go-version: [oldstable, stable]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run go vet
      if: matrix.os == 'ubuntu-latest'
      run: go vet ./...

    # The build users ship: CGO_ENABLED=0, so goffi runs its fakecgo path.
    - name: Run tests
      shell: bash
      run: go test -v -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

    # Race detection uses the toolchain's -race (ThreadSanitizer, needs cgo).
    # A pure-Go detector in the runtime is proposed in golang/go#76786; an external
    # source-level instrumenter can't see the runtime, the standard library or
    # dependencies, so we don't use one in CI.
    # With CGO_ENABLED=1 goffi links the real runtime/cgo instead of its fakecgo,
    # so this step tests that path, not the one above. A non-std cgo package in
    # the test binary would fail to link here on Linux (goffi#72).
    - name: Run tests with the race detector
      shell: bash
      env:
        CGO_ENABLED: "1"
      run: go test -race -count=1 ./...

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        use_oidc: true
        files: ./coverage.txt
        flags: unittests
        name: codecov-gogpu

  # The go.mod `go` line is a promise to every importer, and this machine never
  # tests it (its toolchain is always >= go1.27.3). This job tests exactly that line.
  test-minimum:
    name: Test - ubuntu-latest - Go minimum
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Read the go.mod minimum
      id: gomod
      run: echo "go=$(awk '$1 == "go" { print $2; exit }' go.mod)" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.gomod.outputs.go }}
        cache: true

    - name: Go version
      run: go version

    - name: Run tests
      run: go test -count=1 ./...

  # Deterministic headless rendering against committed software fixtures.
  # Keep this separate from the broad matrix so a missing fixture or an
  # accidental skip cannot make the visual contract appear green.
  golden-tests:
    name: Golden Image Tests
    runs-on: ubuntu-latest
    env:
      GOGPU_GRAPHICS_API: software
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run golden tests
      run: go test -count=1 -run '^TestGolden' ./...

  # Linting
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true

    # The pinned golangci-lint (version and sha256 live in the action) comes
    # from the Actions cache, so lint does not depend on GitHub Releases being
    # reachable on every run; on 2026-11-08 the release download URL returned
    # 504 for over an hour. Bump golangci-lint in gogpu/.github, then move this
    # pin. Keep lint-targets on the same commit.
    - name: Set up golangci-lint
      uses: gogpu/.github/actions/setup-golangci-lint@cdb7bd4a5bd3852541a05f0fa1fa92b09d1ee732 # main 2026-11-08, golangci-lint v2.15.0

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        install-mode: none
        args: --timeout=5m

  # Lint for the other desktop targets. golangci-lint type-checks only the
  # files the target's build compiles, so the darwin and windows files are
  # never linted by the Linux job above. The code is pure Go (CGO_ENABLED=0),
  # so GOOS/GOARCH on a Linux runner select exactly those files, with no need
  # for slower macOS or Windows runners. A file that does not type-check makes
  # golangci-lint exit non-zero, so a broken target cannot pass as "0 issues".
  # One GOARCH per GOOS is enough: no file in the module is arch-specific.
  lint-targets:
    name: Lint - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true

    - name: Set up golangci-lint
      uses: gogpu/.github/actions/setup-golangci-lint@cdb7bd4a5bd3852541a05f0fa1fa92b09d1ee732 # main 2026-11-08, golangci-lint v2.15.0

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      with:
        install-mode: none
        args: --timeout=5m

  # Code formatting check
  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # gofmt's output changes between Go releases: run it on stable, not on
        # the go.mod minimum (gg hit this on curve.go).
        go-version: stable
        cache: true

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "ERROR: The following files are not formatted:"
          gofmt -l .
          echo ""
          echo "Run 'go fmt ./...' to fix formatting issues."
          exit 1
        fi
        echo "All files are properly formatted"

  # Dependency freshness check
  # Uses go-mod-outdated (https://github.com/psampaz/go-mod-outdated)
  # Non-blocking: reports outdated deps as warnings, does not fail CI
  deps:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.25'
        cache: true

    # go-mod-outdated is pinned in tools/go.mod (checksums in tools/go.sum,
    # updated by Dependabot), never installed @latest.
    - name: Check all dependencies
      run: |
        echo "## All Dependencies Status"
        go list -u -m -json all 2>/dev/null | go tool -modfile=tools/go.mod go-mod-outdated -style markdown || true

    - name: Check direct dependencies for updates
      run: |
        echo "## Direct Dependencies with Available Updates"
        OUTDATED=$(go list -u -m -json all 2>/dev/null | go tool -modfile=tools/go.mod go-mod-outdated -update -direct || true)
        if [ -n "$OUTDATED" ]; then
          echo "$OUTDATED"
          echo ""
          echo "::warning::Some direct dependencies have updates available"
        else
          echo "All direct dependencies are up to date!"
        fi

    - name: Check ecosystem dependencies (gogpu/*)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "## Ecosystem Dependencies (gogpu/*)"
        WARNINGS=0

        check_ecosystem_dep() {
          local DEP=$1 REPO=$2
          LOCAL=$(grep "$DEP" go.mod 2>/dev/null | grep -v "^module" | awk '{print $2}')
          [ -z "$LOCAL" ] && return 0

          LATEST=$(gh release view --repo "$REPO" --json tagName -q '.tagName' 2>/dev/null || echo "")
          [ -z "$LATEST" ] && { echo "⚠️  $DEP: $LOCAL (cannot verify)"; return 0; }

          if [ "$LOCAL" = "$LATEST" ]; then
            echo "✅ $DEP: $LOCAL"
          else
            echo "❌ $DEP: $LOCAL → $LATEST available"
            WARNINGS=$((WARNINGS + 1))
          fi
        }

        check_ecosystem_dep "github.com/gogpu/wgpu" "gogpu/wgpu"
        check_ecosystem_dep "github.com/gogpu/naga" "gogpu/naga"
        check_ecosystem_dep "github.com/gogpu/gg" "gogpu/gg"
        check_ecosystem_dep "github.com/go-webgpu/goffi" "go-webgpu/goffi"

        [ $WARNINGS -gt 0 ] && echo "::warning::$WARNINGS ecosystem dep(s) outdated. Run: go get <dep>@latest"
        exit 0  # Non-blocking

    - name: Verify go.mod is tidy
      run: |
        go mod tidy
        go -C tools mod tidy
        if ! git diff --exit-code go.mod go.sum tools/go.mod tools/go.sum; then
          echo "::error::go.mod/go.sum or tools/go.mod/go.sum are not tidy — run 'go mod tidy' (and in tools/) and commit"
          exit 1
        fi

    - name: Verify compositor unidirectional deps
      run: |
        if grep -rn '"github.com/gogpu/gogpu"' internal/compositor/*.go 2>/dev/null; then
          echo "::error::internal/compositor imports root package — circular dependency!"
          exit 1
        fi
        echo "✅ internal/compositor has no reverse imports"

  # Informational on purpose: vulnerability data must be current, and a finding
  # with no fixed version yet (govulncheck exit 3) would otherwise turn every PR
  # red with nothing to fix. continue-on-error keeps the run green; the job is
  # NOT in the gate's needs. A finding that has a fixed version is fixed by
  # updating, never left here.
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run govulncheck
      uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
      with:
        go-version-input: stable

  # The one check the main-protection ruleset requires. Every job that must
  # pass goes into needs, so adding a job or a matrix entry never touches the
  # ruleset. if: always() and the explicit result check are both needed: a job
  # skipped because a job it needs failed or was cancelled counts as passed
  # for a required check, so without them a red PR could go green.
  required:
    name: Required checks
    if: always()
    needs: [build, test, test-minimum, golden-tests, lint, lint-targets, formatting, deps]
    runs-on: ubuntu-latest

    steps:
    - name: Every required job succeeded
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "results: $RESULTS"
        for r in $RESULTS; do
          if [ "$r" != success ]; then
            echo "::error::a required job ended with: $r"
            exit 1
          fi
        done
